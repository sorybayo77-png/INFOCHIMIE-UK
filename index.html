<div id="app"><div class="auth"><p class="muted">Chargement de la plateforme…</p></div></div>
<noscript><p style="padding:20px">Cette plateforme nécessite JavaScript.</p></noscript>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;const t=c.closest('table');c.dataset.l=(t&&t.rows[0]&&t.rows[0].cells[i])?t.rows[0].cells[i].textContent:''}}).observe(document,{childList:true,subtree:true})</script>
<script src="firebase-config.js"></script>
